<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&family=JetBrains+Mono:wght@800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:720px;overflow:hidden;background:#07070c;font-family:Inter,sans-serif;color:#f5f5f7}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 28% 45%,rgba(90,69,201,.55),transparent 55%),radial-gradient(circle at 85% 60%,rgba(200,255,61,.18),transparent 50%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:64px 64px}
.left{position:absolute;left:90px;top:120px;width:760px}
h1{font-family:Anton;font-size:230px;line-height:.9;letter-spacing:4px;text-shadow:7px 0 rgba(255,45,85,.85),-7px 0 rgba(0,230,255,.8)}
.tag{margin-top:26px;font-weight:900;font-size:50px;line-height:1.15}
.tag b{background:#c8ff3d;color:#0d0b22;padding:0 14px;display:inline-block;transform:rotate(-2deg)}
.sub{margin-top:26px;font-size:28px;font-weight:600;opacity:.8}
.pills{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.pills span{font-family:"JetBrains Mono";font-weight:800;font-size:20px;padding:8px 16px;border-radius:30px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.05)}
.phones{position:absolute;right:40px;top:40px;width:760px;height:640px}
.ph{position:absolute;width:250px;height:536px;border-radius:38px;border:8px solid #1d1b33;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(90,69,201,.35)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.p1{left:10px;top:70px;transform:rotate(-9deg)}
.p2{left:255px;top:20px;transform:rotate(0deg);z-index:2;border-color:#c8ff3d}
.p3{left:500px;top:70px;transform:rotate(9deg)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="left">
  <h1>KINETIX</h1>
  <div class="tag">vertical reels from code,<br><b>ON THE BEAT</b></div>
  <div class="sub">music · captions · effects · quality gate · render — one CLI, and a Claude skill that drives it.</div>
  <div class="pills"><span>HyperFrames</span><span>Remotion FX</span><span>MusicGen</span><span>Whisper captions</span></div>
</div>
<div class="phones">
  <div class="ph p1"><img src="../img/poster-chaukanna.jpg"></div>
  <div class="ph p2"><img src="../img/poster-connect.jpg"></div>
  <div class="ph p3"><img src="../img/poster-starter.jpg"></div>
</div>
</body></html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>My Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@800&display=block" rel="stylesheet">
<link rel="stylesheet" href="kinetix.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="hf-bridge.js"></script>
<script src="vendor/remotion-noise.js"></script>
<script src="vendor/remotion-captions.js"></script>
<script src="vendor/remotion-layout-utils.js"></script>
<script src="kinetix.js"></script>
<style>
  @font-face { font-family: "Noto Color Emoji"; src: local("Noto Color Emoji"); }
  html, body { width: 1080px; height: 1920px; }
  /* theme: override any kinetix.css variable */
  :root { --bg: #0b0a1a; --accent: #c8ff3d; --brand: #5a45c9; --hot: #ff3d8b; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="19.2" data-width="1080" data-height="1920">
  <div id="stage"></div>
  <div id="caps"></div>
  <div id="glitch"></div><div id="vig"></div><div id="scan"></div><div id="grain"></div><div id="flash"></div>
  <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="19.2" data-track-index="10" data-volume="1"></audio>
</div>
<script>
// 150 bpm: a beat is 0.4 s, a bar 1.6 s. Keep every time on this grid and music.py hits land with the cuts.
const K = Kinetix.init({
  width: 1080, height: 1920, bpm: 150,
  build: [[3.2, 9.2]],            // pulsing camera + bar flashes
  drops: [[9.6, 16.0]],           // heavy beat shake, zoom punch, flash on entry
  glitches: [9.6, 16.0],          // RGB slice glitch on these cuts
  fonts: ["100px Anton", "900 50px Inter", "700 50px Inter", "800 50px 'JetBrains Mono'"],
});
const { scene, slam, rise, tf, spring, clamp, lerp, easeOut, easeIO } = K;
const at = (x, y) => `left:${x}px;top:${y}px;`;

// ---- hook (0 – 3.2)
scene(0, 3.2, `
  <div class="c tag t0" style="${at(540, 520)}">POV</div>
  <div class="c big t1" style="${at(540, 760)}font-size:150px">YOU NEED A REEL</div>
  <div class="c big t2" style="${at(540, 930)}font-size:170px"><span class="hl hot">BY TONIGHT</span> 💀</div>
  <div class="c small t3" style="${at(540, 1180)}">and you can't edit video</div>`,
  (lt, q) => { slam(q(".t0"), lt, .1, { from: 1.4 }); slam(q(".t1"), lt, .4); slam(q(".t2"), lt, 1.2, { from: 2.6, r: -2 }); rise(q(".t3"), lt, 2.0); });

// ---- build (3.2 – 9.2): one item per beat pair, held so it can be read
const ITEMS = [["🎵", "MUSIC", "on the beat"], ["💬", "CAPTIONS", "word by word"], ["✨", "EFFECTS", "leaks · glitch · shake"], ["🎬", "RENDER", "checked + exported"]];
scene(3.2, 9.2, `
  <div class="c big h" style="${at(540, 380)}font-size:130px">KINETIX DOES</div>
  ${ITEMS.map((it, i) => `<div class="chip k${i}" style="${at(540, 640 + i * 230)}font-size:56px">${it[0]} ${it[1]} <span style="opacity:.6;font-weight:700;font-size:38px">· ${it[2]}</span></div>`).join("")}`,
  (lt, q) => { slam(q(".h"), lt, 0); ITEMS.forEach((_, i) => slam(q(".k" + i), lt, .8 + i * 1.2, { from: 1.6 })); });

// ---- the gap (9.2 – 9.6): music.py cuts the sound here, so the drop hits harder
scene(9.2, 9.6, `<div class="c t" style="${at(540, 960)}font-size:64px;font-style:italic;font-weight:500">so…</div>`,
  (lt, q) => tf(q(".t"), { o: clamp(lt * 8) }));

// ---- drop (9.6 – 16.0)
scene(9.6, 12.8, `
  <div class="c glow" style="${at(540, 800)}width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle, rgba(90,69,201,.6), transparent 60%)"></div>
  <div class="c ring" style="${at(540, 800)}width:420px;height:420px;border-radius:50%;border:14px solid var(--accent)"></div>
  <div class="c big name" style="${at(540, 800)}font-size:230px">KINETIX</div>
  <div class="c mid s1" style="${at(540, 1040)}">reels from code,</div>
  <div class="c big s2" style="${at(540, 1200)}font-size:160px"><span class="hl acc">ON THE BEAT</span></div>`,
  (lt, q) => {
    slam(q(".name"), lt, 0, { from: 3 });
    const sp = clamp(lt / .6); tf(q(".ring"), { s: lerp(.3, 4, easeOut(sp)), o: 1 - sp });
    tf(q(".glow"), { s: 1 + .08 * Math.exp(-((lt % K.B) / .1)) });
    rise(q(".s1"), lt, .8); slam(q(".s2"), lt, 1.6, { r: -2 });
  });

const STATS = [["150", "BPM", "every cut on the grid"], ["0", "TIMELINES", "you drag by hand"], ["1", "COMMAND", "kinetix render"], ["∞", "TAKES", "change the code, re-render"]];
STATS.forEach(([n, u, line], i) => scene(12.8 + i * .8, 13.6 + i * .8, `
  <div class="c big n" style="${at(540, 820)}font-size:340px">${n}<span class="acc" style="font-size:.4em;margin-left:14px">${u}</span></div>
  <div class="c mid l" style="${at(540, 1090)}">${line}</div>`,
  (lt, q) => { slam(q(".n"), lt, 0, { from: 2.6, r: i % 2 ? 2 : -2 }); rise(q(".l"), lt, .1, { dur: .2 }); }));

// ---- outro (16.0 – 19.2)
scene(16.0, 19.2, `
  <div class="c big name" style="${at(540, 860)}font-size:200px">KINETIX</div>
  <div class="c mid b" style="${at(540, 1050)}">now go make yours.</div>
  <div class="c small mono u" style="${at(540, 1250)}font-size:40px;color:var(--accent)">kinetix new my-reel</div>`,
  (lt, q) => {
    K.stage.style.background = "radial-gradient(circle at 50% 45%, #2a1f6b, #0b0a1a 70%)";
    slam(q(".name"), lt, .05, { from: 3 }); rise(q(".b"), lt, .6); rise(q(".u"), lt, 1.2);
    K.stage.style.opacity = 1 - clamp((lt - 2.6) / .5);
  });

K.start({ dur: 19.2 }).then(({ timeline }) => { window.__timelines["main"] = timeline; });
</script>
</body>
</html>
